<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Primary Title & Brand Identity -->
    <title>PHANTOM — Fine Goods &amp; Atelier Editions</title>
    <meta
      name="description"
      content="Archival apparel and considered leather goods, crafted in limited seasonal editions with historic European mills. Free two-year atelier repair promise."
    />
    <meta
      name="keywords"
      content="Phantom, Phantom Atelier, fine goods, archival apparel, luxury menswear, outerwear, selvedge denim, leather goods, minimalist fashion, slow fashion"
    />
    <meta name="author" content="Phantom Studio" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://phantom.oluwadamilare.xyz/" />

    <!-- Favicon & PWA App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Mobile Theme Colors -->
    <meta name="theme-color" content="#0d0c0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph (Facebook, iMessage, WhatsApp, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PHANTOM" />
    <meta property="og:url" content="https://phantom.oluwadamilare.xyz/" />
    <meta property="og:title" content="PHANTOM — Fine Goods &amp; Atelier Editions" />
    <meta
      property="og:description"
      content="Archival apparel and considered leather goods, crafted in limited seasonal editions with historic European mills."
    />
    <meta property="og:image" content="https://phantom.oluwadamilare.xyz/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PHANTOM Atelier &amp; Fine Goods" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@phantom" />
    <meta name="twitter:creator" content="@phantom" />
    <meta name="twitter:title" content="PHANTOM — Fine Goods &amp; Atelier Editions" />
    <meta
      name="twitter:description"
      content="Archival apparel and considered leather goods, crafted in limited seasonal editions with historic European mills."
    />
    <meta name="twitter:image" content="https://phantom.oluwadamilare.xyz/og-image.svg" />
    <meta name="twitter:image:alt" content="PHANTOM Atelier &amp; Fine Goods" />

    <!-- Schema.org JSON-LD Structured Data for Google Search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://phantom.oluwadamilare.xyz/#organization",
            "name": "PHANTOM",
            "url": "https://phantom.oluwadamilare.xyz",
            "logo": {
              "@type": "ImageObject",
              "url": "https://phantom.oluwadamilare.xyz/favicon.svg"
            },
            "description": "Considered archival essentials and limited-run leather goods crafted in historic European mills.",
            "email": "hello@phantom.studio"
          },
          {
            "@type": "WebSite",
            "@id": "https://phantom.oluwadamilare.xyz/#website",
            "url": "https://phantom.oluwadamilare.xyz",
            "name": "PHANTOM",
            "publisher": {
              "@id": "https://phantom.oluwadamilare.xyz/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://phantom.oluwadamilare.xyz/shop?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Google Identity Services for native Google One-Tap & Account Chooser -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
